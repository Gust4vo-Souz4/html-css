<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Flexível</title>
</head>
<body>
    <h1>Imagem Flexível</h1>
    <p>Você está vendo a imagem completa? Experimente ampliar o tamanho da sua janela para aproveitar a melhor experiência!</p>
    <picture>
        <source media="(max-width: 750px)" srcset="nature-500.jpg" type="image/jpg">
        <source media="(max-width: 1050px)" srcset="nature-700.jpg" type="image/jpg">
        <img src="nature-1050.jpg" alt="Imagem de natureza">
    </picture>
    <!-- Lembrar de alterar no atributo "media" de min-width para max-width -->
     <p>
        &#x2705 <strong>Desafio concluído!</strong>
     </p>
</body>
</html>

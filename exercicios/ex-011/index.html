<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplismente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <audio preload="metadata" controls> <!-- "autoplay" já começa a reproduzir automaticamente em alguns navegadores. "loop" faz com que ao terminar o áudio, ele recomeçe novamente. -->
        <source src="audios/guanacast-33.mp3" type="audio/mpeg">
        <!-- O navegador irá escolher o formato de áudio que ele suporta. Evitar o arquivo wav, pois é o mais pesado. -->
        <p>Infelizmente seu navegador não suporta o elemento de reprodução de áudio.
        <a href="audios/guanacast-33.mp3">Baixe o áudio aqui</a> para ouvir.</p>
        </p>
    </audio>
    <!-- MP3, WAV, OGG -->
</body>
</html>
